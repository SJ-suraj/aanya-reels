name: render
on:
  push:
    branches: [main]
    paths: ["jobs/*.json"]
  workflow_dispatch:
concurrency:
  group: render
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -version | head -1
      - name: render every job without a reel yet
        run: |
          set -euo pipefail
          for j in jobs/*.json; do
            [ -f "$j" ] || continue
            name=$(jq -r .name "$j")
            [ -f "reels/$name.mp4" ] && continue
            d=$(mktemp -d)
            i=1
            for u in $(jq -r '.urls[]' "$j"); do curl -fsSL -o "$d/0$i.png" "$u"; i=$((i+1)); done
            bash tools/make_reel.sh "$d/01.png" "$d/02.png" "$d/03.png" "reels/$name.mp4"
            ffmpeg -i "reels/$name.mp4" 2>&1 | grep -E 'Duration|1080x1920'
          done
      - name: commit reels
        run: |
          git config user.name aanya-render && git config user.email aanya-render@users.noreply.github.com
          git add reels/*.mp4 && git diff --cached --quiet && exit 0
          git commit -qm "render: $(git diff --cached --name-only | xargs -n1 basename | tr '\n' ' ')"
          git push origin HEAD:main
