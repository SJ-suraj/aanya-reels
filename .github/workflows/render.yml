name: render
on:
  push:
    branches: [main]
    paths: ["jobs/*.json"]
  workflow_dispatch:
concurrency:
  group: render
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -version | head -1
      - name: render every job without a reel yet
        run: |
          set -euo pipefail
          for j in jobs/*.json; do
            [ -f "$j" ] || continue
            name=$(jq -r .name "$j")
            [ -f "reels/$name.mp4" ] && continue
            d=$(mktemp -d)
            i=1
            while IFS= read -r u; do curl -fsSL -o "$d/$(printf '%03d' $i).png" "$u"; i=$((i+1)); done < <(jq -r '.urls[]' "$j")
            kind=$(jq -r '.kind // "reel"' "$j")
            if [ "$kind" = "montage" ]; then
              secs=$(jq -r '.seconds // 12' "$j")
              bash tools/make_montage.sh "reels/$name.mp4" "$secs" "$d"/*.png
            else
              bash tools/make_reel.sh "$d/001.png" "$d/002.png" "$d/003.png" "reels/$name.mp4"
            fi
            ffprobe -v error -show_entries format=duration:stream=width,height -of default=nw=1 "reels/$name.mp4"
          done
      - name: commit reels
        run: |
          git config user.name aanya-render && git config user.email aanya-render@users.noreply.github.com
          git add reels/*.mp4 && git diff --cached --quiet && exit 0
          git commit -qm "render: $(git diff --cached --name-only | xargs -n1 basename | tr '\n' ' ')"
          git push origin HEAD:main
